# Projet Xcode de l'app iOS, généré par XcodeGen (`xcodegen generate` dans ce dossier) : pas de .xcodeproj
# à maintenir. L'interface et la logique viennent du module Kotlin `shared` (framework « Shared »).
name: MesCourses
options:
  bundleIdPrefix: fr.mescourses
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.19.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MesCourses:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - target: ShareExtension
        embed: true
    preBuildScripts:
      - name: Compiler le code Kotlin (shared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mescourses.app
        PRODUCT_NAME: MesCourses
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: fr
        CFBundlePackageType: APPL
        CFBundleDisplayName: Mes courses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Les sites des drives peuvent demander ta position pour proposer un magasin proche.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: fr.mescourses.app
            CFBundleURLSchemes: [mescourses]

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mescourses.app.partage
        PRODUCT_NAME: MesCoursesPartage
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: fr
        CFBundlePackageType: XPC!
        CFBundleDisplayName: Mes courses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
