name: Core iOS

# Portage iOS : vérifie que la logique métier partagée (module core, Kotlin Multiplatform)
# compile pour iPhone et passe ses tests sur le simulateur iOS.
on:
  push:
    paths: ["core/**", "gradle/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["core/**", "gradle/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation iOS (iPhone et simulateur)
        run: ./gradlew -p core compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --stacktrace

      - name: Tests (JVM et simulateur iOS)
        run: ./gradlew -p core allTests --stacktrace

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-ios
          path: core/build/reports/tests/
